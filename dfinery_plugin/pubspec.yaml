name: dfinery_plugin
description: "Official Dfinery Flutter plugin for customer data analytics, event tracking, user profiling, and push notification integration. Easily connect your Flutter app to Dfinery SDK."
version: 2.0.0
homepage: https://docs.dfinery.ai/developer-guide/platform/flutter

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.igaworks.dfinery.dfinery_plugin
        pluginClass: DfineryPlugin
      ios:
        pluginClass: DfineryPlugin
